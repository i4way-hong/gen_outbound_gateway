<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>관리자 로그인</title>
    <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<div class="container">
    <div class="page-header">
        <div>
            <h1>관리자 로그인</h1>
            <p class="subtitle">관리자 계정으로 로그인하세요.</p>
        </div>
        <div class="actions">
            <a class="btn ghost" href="/">홈</a>
        </div>
    </div>

    <div class="alert" th:if="${error}" th:text="${error}"></div>
    <div class="alert" th:if="${logout}">로그아웃되었습니다.</div>

    <div class="alert" th:if="${!adminConfigured}">
        관리자 계정이 설정되지 않았습니다. 환경변수 `ADMIN_USERNAME`, `ADMIN_PASSWORD`를 설정하세요.
    </div>

    <form class="form" method="post" action="/console/session/new" th:if="${adminConfigured}">
        <label class="field">
            <span>아이디</span>
            <input type="text" name="username" />
        </label>

        <label class="field">
            <span>비밀번호</span>
            <input type="password" name="password" />
        </label>

        <div class="actions">
            <button class="btn" type="submit">로그인</button>
        </div>
    </form>
</div>
</body>
</html>
