<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${form.id} == null ? '사용자 생성' : '사용자 편집'">사용자</title>
    <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<div class="container">
    <div class="page-header">
        <div>
            <h1 th:text="${form.id} == null ? '사용자 생성' : '사용자 편집'"></h1>
            <p class="subtitle">사용자 계정과 역할을 설정합니다.</p>
        </div>
        <div class="actions">
            <a class="btn ghost" href="/admin/users">목록</a>
        </div>
    </div>

    <nav class="admin-nav">
        <a class="active" href="/admin/users">사용자</a>
        <a href="/admin/roles">역할</a>
        <a href="/admin/permissions">권한</a>
        <a href="/">홈</a>
        <a href="/admin/logout">로그아웃</a>
    </nav>

    <div class="alert" th:if="${error}" th:text="${error}"></div>

    <form class="form" th:action="${form.id} == null ? '/admin/users' : @{/admin/users/{id}(id=${form.id})}" method="post">
        <input type="hidden" name="id" th:value="${form.id}" />

        <label class="field">
            <span>사용자명</span>
            <input type="text" name="username" th:value="${form.username}" th:readonly="${form.id} != null" />
        </label>

        <label class="field">
            <span>비밀번호</span>
            <input type="password" name="password" placeholder="비밀번호 입력" />
            <small th:if="${form.id} != null">비밀번호를 변경하지 않으려면 비워두세요.</small>
        </label>

        <label class="field checkbox">
            <input type="checkbox" name="enabled" th:checked="${form.enabled}" />
            <span>활성 상태</span>
        </label>

        <div class="field">
            <span>역할 선택</span>
            <div class="checkbox-grid">
                <label class="checkbox" th:each="role : ${roles}">
                    <input type="checkbox" name="roleIds" th:value="${role.id}" th:checked="${form.roleIds.contains(role.id)}" />
                    <span th:text="${role.name}"></span>
                </label>
            </div>
            <small th:if="${#lists.isEmpty(roles)}">등록된 역할이 없습니다. 먼저 역할을 생성하세요.</small>
        </div>

        <div class="actions">
            <button class="btn" type="submit">저장</button>
            <a class="btn ghost" href="/admin/users">취소</a>
        </div>
    </form>
</div>
</body>
</html>
