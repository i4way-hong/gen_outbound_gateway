<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>역할 관리</title>
    <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<div class="container wide">
    <div class="page-header">
        <div>
            <h1>역할 관리</h1>
            <p class="subtitle">역할별 권한 묶음을 관리합니다.</p>
        </div>
        <div class="actions">
            <a class="btn" href="/console/roles/new">새 역할</a>
        </div>
    </div>

    <nav class="admin-nav">
    <a href="/console/users">사용자</a>
    <a class="active" href="/console/roles">역할</a>
    <a href="/console/permissions">권한</a>
        <a href="/">홈</a>
    <a href="/console/session/end">로그아웃</a>
    </nav>

    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>역할명</th>
            <th>활성</th>
            <th>권한 수</th>
            <th>작업</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(roles)}">
            <td colspan="5" class="empty">등록된 역할이 없습니다.</td>
        </tr>
        <tr th:each="role : ${roles}">
            <td th:text="${role.id}"></td>
            <td th:text="${role.name}"></td>
            <td>
                <span th:class="${role.enabled} ? 'badge success' : 'badge danger'"
                      th:text="${role.enabled} ? '활성' : '비활성'"></span>
            </td>
            <td th:text="${role.permissionCount}"></td>
            <td>
                <a class="link" th:href="@{/console/roles/{id}(id=${role.id})}">편집</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
