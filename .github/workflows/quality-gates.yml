name: quality-gates

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "0 20 * * 0" # KST 월요일 05:00

permissions:
  contents: read

jobs:
  static-quality:
    name: Static Quality (Checkstyle/SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Genesys SDK to local Maven repository
        run: bash scripts/install-genesys-sdk-local.sh

      - name: Maven verify (skip tests)
        run: mvn -B -DskipTests verify

  targeted-regression:
    name: Targeted Regression Tests
    runs-on: ubuntu-latest
    needs: [static-quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Genesys SDK to local Maven repository
        run: bash scripts/install-genesys-sdk-local.sh

      - name: Run targeted regression tests
        run: mvn -B "-Dtest=AuthControllerTests,GenOutboundGatewayApplicationTests,GenesysConnectionConfigValidatorTests" test

  full-verify-weekly:
    name: Full Verify (with tests, weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Genesys SDK to local Maven repository
        run: bash scripts/install-genesys-sdk-local.sh

      - name: Maven verify (with tests)
        run: mvn -B verify
